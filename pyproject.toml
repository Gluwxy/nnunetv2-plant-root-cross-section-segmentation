[project]
name = "root-cross-section-segmentation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rootutils",
    "roboflow",
    "torch",
    "monai >= 1.6.1",
    "nnunetv2",
    "omegaconf",
    "hydra-core",
    "wandb",
    "opencv-python",
    "matplobblib",
    "ipykernel>=7.4.0",
]

[tool.uv.sources]
nnunetv2 = { git = "https://github.com/MIC-DKFZ/nnUNet.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
